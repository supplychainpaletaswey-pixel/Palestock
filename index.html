<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --brand:#d94f3d; --brand-d:#b23a2b; --brand-tint:#fdeeec;
    --bg:#f4f6f8; --surface:#ffffff; --border:#e4e7ec; --border-2:#d0d5dd;
    --text:#101828; --muted:#667085;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
  /* ---------- Top bar ---------- */
  .appbar{background:var(--surface);border-bottom:1px solid var(--border);
    box-shadow:0 1px 3px rgba(16,24,40,.05);position:sticky;top:0;z-index:30}
  .appbar-inner{max-width:1480px;margin:0 auto;padding:10px 20px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand .logo{width:46px;height:46px;border-radius:12px;overflow:hidden;flex:0 0 auto;
    box-shadow:0 3px 10px rgba(217,79,61,.28)}
  .brand .logo img{width:100%;height:100%;object-fit:cover;display:block}
  .brand .eyebrow{font-size:10.5px;letter-spacing:.14em;color:var(--brand);
    text-transform:uppercase;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:6px}
  .brand .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:#18b24b;
    box-shadow:0 0 0 3px rgba(24,178,75,.18);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .brand h1{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
  .spacer{flex:1 1 auto}
  .clock{font-size:12px;color:var(--muted);text-align:right;line-height:1.2}
  .clock b{display:block;color:var(--text);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  /* ---------- Tabs ---------- */
  .tabs{max-width:1480px;margin:0 auto;padding:0 12px;display:flex;gap:4px;width:100%;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{appearance:none;border:none;background:transparent;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);
    padding:12px 16px;border-bottom:2.5px solid transparent;margin-bottom:-1px;
    display:inline-flex;align-items:center;gap:8px;transition:color .12s,border-color .12s;white-space:nowrap}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--brand);border-bottom-color:var(--brand)}
  .tab .ic{font-size:15px}
  /* ---------- Demo banner ---------- */
  .demo{max-width:1480px;margin:10px auto 0;padding:9px 16px;background:var(--brand-tint);
    border:1px solid #f3c7c0;border-radius:10px;color:#7a2a1e;font-size:12.5px;font-weight:500;
    display:flex;align-items:center;gap:10px;line-height:1.45;width:calc(100% - 24px)}
  .demo b{font-weight:700}
  .demo .x{margin-left:auto;cursor:pointer;border:none;background:none;color:#7a2a1e;
    font-size:16px;font-weight:700;flex:0 0 auto;line-height:1;padding:2px 4px;border-radius:6px}
  .demo .x:hover{background:#f6d3cc}
  /* ---------- Frames ---------- */
  .frames{flex:1 1 auto;position:relative;min-height:0}
  .frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);
    opacity:0;visibility:hidden;transition:opacity .15s}
  .frames iframe.active{opacity:1;visibility:visible}
  @media(max-width:620px){
    .appbar-inner{padding:9px 14px}
    .brand h1{font-size:17px}
    .clock{display:none}
    .tab{padding:11px 12px;font-size:13px}
    .tab .lbl-full{display:none}
  }
</style>
</head>

    <span><b>Mode demo</b> — data contoh ditampilkan. Hubungkan ke backend Google Apps Script untuk data &amp; input langsung.</span>
    <button class="x" id="demo-x" title="Tutup" aria-label="Tutup">✕</button>

  <div class="frames" id="frames">
    <iframe id="f-form"     data-src="form.html"     title="Form Stok" class="active"></iframe>
    <iframe id="f-delivery" data-src="delivery.html" title="Pengiriman"></iframe>
    <iframe id="f-coverage" data-src="coverage.html" title="Stock Coverage"></iframe>
  </div>

<script>
  var VIEWS = ['form','delivery','coverage'];
  var tabs  = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var loaded = {};

  function ensureLoaded(view){
    if(loaded[view]) return;
    var fr = document.getElementById('f-'+view);
    fr.src = fr.getAttribute('data-src');
    loaded[view] = true;
  }
  function show(view){
    if(VIEWS.indexOf(view) < 0) view = 'form';
    ensureLoaded(view);
    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.view === view); });
    VIEWS.forEach(function(v){
      document.getElementById('f-'+v).classList.toggle('active', v === view);
    });
    if(location.hash.slice(1) !== view) history.replaceState(null, '', '#'+view);
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ show(t.dataset.view); }); });
  window.addEventListener('hashchange', function(){ show(location.hash.slice(1)); });

  // live clock (Asia/Makassar — Bali / WITA)
  function tick(){
    try{
      document.getElementById('clock').textContent =
        new Date().toLocaleTimeString('en-GB', {hour12:false, timeZone:'Asia/Makassar'});
    }catch(e){
      document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB',{hour12:false});
    }
  }
  setInterval(tick, 1000); tick();

  document.getElementById('demo-x').addEventListener('click', function(){
    document.getElementById('demo').style.display = 'none';
  });

  // initial view from the URL hash (deep-linkable)
  show((location.hash.slice(1)) || 'form');
</script>
